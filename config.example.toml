# Copiá este archivo como config.toml. No se sube a Git.

[gmail]
credentials_file = "credentials.json"
token_file = "token.json"

[selection]
# Gmail admite casi la misma sintaxis que su buscador web.
# Esta consulta sólo encuentra candidatos; jamás ejecuta cambios por sí sola.
query = "older_than:90d (category:promotions OR category:updates OR in:spam)"
max_messages = 10000

# Protección adicional a STARRED, IMPORTANT, SENT y DRAFT, que siempre se respetan.
protected_labels = ["Trabajo", "Familia", "Pagos"]
protected_senders = [
  # "persona@example.com",
  # "@banco.example",
]

[unsubscribe]
# La baja sólo se ejecuta si además marcás SI para ese remitente en el CSV.
enabled = true
timeout_seconds = 15
