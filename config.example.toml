# Configuración prevista para la aplicación local. En el Hito 0 la interfaz
# muestra estos valores, pero no admite datos reales ni conexión a Gmail.

[app]
mode = "synthetic"
host = "127.0.0.1"
port = 8765
timezone = "America/Argentina/Cordoba"

[protection]
labels = ["Trabajo", "Familia", "Pagos"]

[capabilities]
gmail = false
oauth = false
remote_ai = false
permanent_delete = false
