[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "limpiar-mails"
version = "0.1.0"
description = "Auditor local y seguro para limpiar newsletters y spam de Gmail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
limpiar-mails = "gmail_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
